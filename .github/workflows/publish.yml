name: Compile, Sign and Deploy APT Repository to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      agent_version:
        description: Agent release version to publish; leave empty to rebuild latest
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  agent-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agent.outputs.version }}
      publish: ${{ steps.agent.outputs.publish }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Agent release against the APT index
        id: agent
        env:
          ZL_AGENT_VERSION: ${{ inputs.agent_version }}
        run: bash check-agent-release.sh

  build-and-deploy:
    needs: agent-release
    if: needs.agent-release.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.outputs != '' && fromJSON(steps.deployment.outputs.outputs).page_url || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Debian Packaging and Repository Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper apt-utils gpg build-essential

      - name: Build Packages and Build Repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          ZL_AGENT_VERSION: ${{ needs.agent-release.outputs.version }}
        run: |
          ./build-repo.sh

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 5
          attempt_delay: 15000
